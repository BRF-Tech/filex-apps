# The end-to-end stack (scripts/e2e.sh): the store, the real filex validators,
# a mock of GitHub, an HTTPS edge and Playwright in Chromium, Firefox and
# WebKit, driving every flow through the store's pages. Heavy (several images
# are built and the browsers run one after another), so it is started by hand:
# Actions -> e2e -> Run workflow.
name: e2e

on:
  workflow_dispatch:
    inputs:
      browsers:
        description: Browsers (comma-separated)
        default: chromium,firefox,webkit
        required: true
      grep:
        description: Only the tests whose title matches this pattern (empty = all)
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (${{ inputs.browsers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: scripts/e2e.sh
        env:
          E2E_BROWSERS: ${{ inputs.browsers }}
          E2E_GREP: ${{ inputs.grep }}
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: bash scripts/e2e.sh
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: ignore
          retention-days: 14
